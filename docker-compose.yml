version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gestion_inmuebles_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gestion_inmuebles
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion_inmuebles_backend
    environment:
      DATABASE_URL: "postgresql://admin:adminpassword@db:5432/gestion_inmuebles?schema=public"
      PORT: 3000
      JWT_SECRET: "super-secret-jwt-key"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:3000"
    container_name: gestion_inmuebles_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
